name: 跨平台构建 (macOS & Windows)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 安装 OpenCV
        run: brew install opencv
      
      - name: 为 macOS 构建
        run: cargo build --release
      
      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bobo-ro-ctd-macos
          path: target/release/bobo-ro-ctd

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: 安装 vcpkg
        run: |
          if (!(Test-Path "D:\vcpkg\.git")) {
            git clone https://github.com/Microsoft/vcpkg.git D:\vcpkg
            cd D:\vcpkg
            .\bootstrap-vcpkg.bat
          }
        shell: powershell
      
      - name: 安装 OpenCV（通过 vcpkg）
        run: |
          D:\vcpkg\vcpkg.exe install opencv:x64-windows --recurse
        shell: cmd
      
      - name: 为 Windows 构建
        run: |
          $env:VCPKG_ROOT="D:\vcpkg"
          $env:OPENCV_DIR="D:\vcpkg\installed\x64-windows"
          cargo build --release
      
      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bobo-ro-ctd-windows
          path: target/release/bobo-ro-ctd.exe
