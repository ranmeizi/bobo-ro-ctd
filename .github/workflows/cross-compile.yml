name: Windows 构建

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: 安装 vcpkg
        run: |
          if (!(Test-Path "D:\vcpkg\.git")) {
            git clone https://github.com/Microsoft/vcpkg.git D:\vcpkg
            cd D:\vcpkg
            .\bootstrap-vcpkg.bat
          }
        shell: powershell
      
      - name: 安装 OpenCV（通过 vcpkg）
        run: |
          D:\vcpkg\vcpkg.exe install opencv:x64-windows --recurse
        shell: cmd

      - name: 为 Windows 构建
        run: |
          $env:VCPKG_ROOT="D:\vcpkg"
          $env:OPENCV_DIR="D:\vcpkg\installed\x64-windows"
          cargo build --release

      - name: 整理 Windows 打包目录
        shell: powershell
        run: |
          $packageDir = "target/release/package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir/assets/fonts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir/assets/voice" | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir/config" | Out-Null

          # 1) exe 放到打包根目录
          Copy-Item "target/release/bobo-ro-ctd.exe" "$packageDir/bobo-ro-ctd.exe" -Force

          # 2) 字体按相对路径放到 exe 同层下的 assets/fonts/
          Copy-Item "assets/fonts/NotoSansSC-Regular.otf" "$packageDir/assets/fonts/NotoSansSC-Regular.otf" -Force

          # 2.1) 倒计时语音资源按相对路径放到 exe 同层下的 assets/voice/
          if (Test-Path "assets/voice") {
            Copy-Item "assets/voice/*" "$packageDir/assets/voice/" -Recurse -Force
          } else {
            Write-Host "assets/voice not found, skip voice assets copy."
          }

          # 2.2) 默认配置文件放到 exe 同层下的 config/
          if (Test-Path "config/config.toml") {
            Copy-Item "config/config.toml" "$packageDir/config/config.toml" -Force
          } else {
            Write-Host "config/config.toml not found, skip config copy."
          }

          # 3) 仅使用项目内置 DLL，并同步到构建目录 target/release
          $customDlls = @(
            "assets/opencv_core4.dll",
            "assets/opencv_imgproc4.dll"
          )

          foreach ($dll in $customDlls) {
            if (-not (Test-Path $dll)) {
              throw "Missing custom DLL: $dll"
            }
            Copy-Item $dll $packageDir -Force
            Copy-Item $dll "target/release" -Force
          }
      
      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bobo-ro-ctd-windows
          path: target/release/package

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: bobo-ro-ctd-windows
          path: bobo-ro-ctd-windows

      - name: 打包 zip
        run: |
          cd bobo-ro-ctd-windows
          zip -r ../bobo-ro-ctd-windows.zip .

      # 注意：GitHub 开启「不可变 Release」后，不能向已存在的同一 tag 的 Release 再次上传/替换附件。
      # 若需重新发包：请使用新 tag（如 v0.2.3），或先在网页上删除该 Release 后再推送同一 tag 重跑。
      # allowUpdates: true 会在重跑同一 tag 时触发更新已有 Release，从而报错 immutable。
      - name: 发布 Release 并上传附件
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bobo-ro-ctd-windows.zip"
          allowUpdates: false
          generateReleaseNotes: true
