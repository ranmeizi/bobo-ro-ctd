name: Windows 构建

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 缓存 vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      
      - name: 安装 vcpkg
        run: |
          if (!(Test-Path "D:\vcpkg\.git")) {
            git clone https://github.com/Microsoft/vcpkg.git D:\vcpkg
            cd D:\vcpkg
            .\bootstrap-vcpkg.bat
          }
        shell: powershell
      
      - name: 安装 OpenCV（通过 vcpkg）
        run: |
          D:\vcpkg\vcpkg.exe install opencv:x64-windows --recurse
        shell: cmd

      - name: 调试 OpenCV DLL 列表
        shell: powershell
        run: |
          $opencvCandidateDirs = @(
            "D:\vcpkg\installed\x64-windows\bin",
            "D:\vcpkg\installed\x64-windows\tools\opencv\bin",
            "D:\vcpkg\packages\opencv_x64-windows\bin"
          )

          Write-Host "=== OpenCV candidate directories ==="
          foreach ($dir in $opencvCandidateDirs) {
            Write-Host "$dir (exists: $(Test-Path $dir))"
          }

          Write-Host "=== Matched opencv*.dll files ==="
          foreach ($dir in $opencvCandidateDirs) {
            if (Test-Path $dir) {
              Write-Host "--- $dir ---"
              $dlls = Get-ChildItem -Path $dir -Filter "opencv*.dll" -File -ErrorAction SilentlyContinue
              if ($dlls.Count -eq 0) {
                Write-Host "(none)"
              } else {
                $dlls | Select-Object Name, Length, FullName | Format-Table -AutoSize
              }
            }
          }
      
      - name: 为 Windows 构建
        run: |
          $env:VCPKG_ROOT="D:\vcpkg"
          $env:OPENCV_DIR="D:\vcpkg\installed\x64-windows"
          cargo build --release

      - name: 整理 Windows 打包目录
        shell: powershell
        run: |
          $packageDir = "target/release/package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir/assets/fonts" | Out-Null

          # 1) exe 放到打包根目录
          Copy-Item "target/release/bobo-ro-ctd.exe" "$packageDir/bobo-ro-ctd.exe" -Force

          # 2) 字体按相对路径放到 exe 同层下的 assets/fonts/
          Copy-Item "assets/fonts/NotoSansSC-Regular.otf" "$packageDir/assets/fonts/NotoSansSC-Regular.otf" -Force

          # 3) 复制 OpenCV 运行时 DLL 到 exe 同层
          # 先找 opencv_world*.dll，找不到则回退到 opencv_*.dll（分模块构建）
          $opencvCandidateDirs = @(
            "D:\vcpkg\installed\x64-windows\bin",
            "D:\vcpkg\installed\x64-windows\tools\opencv\bin",
            "D:\vcpkg\packages\opencv_x64-windows\bin"
          )

          $opencvBin = $null
          foreach ($dir in $opencvCandidateDirs) {
            if (Test-Path $dir) {
              $opencvBin = $dir
              break
            }
          }

          if (-not $opencvBin) {
            throw "OpenCV bin directory not found under D:\vcpkg."
          }

          $opencvDlls = Get-ChildItem -Path $opencvBin -Filter "opencv_world*.dll" -File -ErrorAction SilentlyContinue
          if ($opencvDlls.Count -eq 0) {
            $opencvDlls = Get-ChildItem -Path $opencvBin -Filter "opencv_*.dll" -File -ErrorAction SilentlyContinue
          }

          if ($opencvDlls.Count -eq 0) {
            Write-Host "No OpenCV runtime DLL found in $opencvBin"
            Get-ChildItem -Path $opencvBin | Select-Object -First 50 | Format-Table -AutoSize
            throw "OpenCV runtime DLL not found (opencv_world*.dll or opencv_*.dll)."
          }

          Copy-Item $opencvDlls.FullName $packageDir -Force
      
      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bobo-ro-ctd-windows
          path: target/release/package
